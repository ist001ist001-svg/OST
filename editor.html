{% extends "base.html" %}

{% block content %}

<h1>📝 파일 편집</h1>
<p>{{ project.name }}</p>

<form method="POST"
      action="{{ url_for('edit_file', project_id=project.id) }}">

    <input type="hidden" name="_csrf" value="{{ csrf_token }}">

    <label>파일 경로</label>

    <input
        name="filename"
        value="{{ filename }}"
        required
    >

    <label>코드 편집</label>

    <textarea
        name="content"
        spellcheck="false"
        autocapitalize="off"
        autocomplete="off"
    >{{ content }}</textarea>

    <button type="submit" class="full-button">
        저장하기
    </button>

</form>

<a class="back-button"
   href="{{ url_for('files', project_id=project.id) }}">
    ← 파일 목록
</a>

{% endblock %}
