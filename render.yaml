services:
  - type: web
    name: ist-host
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: ist-host-db
          property: connectionString

      - key: DISCORD_CLIENT_ID
        sync: false

      - key: DISCORD_CLIENT_SECRET
        sync: false

      - key: DATA_DIR
        value: /var/data

    disk:
      name: ist-host-data
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: ist-host-db
    plan: free
