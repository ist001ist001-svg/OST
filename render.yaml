services:
  - type: web
    name: ist-host
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app
    disk:
      name: ist-host-storage
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8

      - key: SECRET_KEY
        generateValue: true

      - key: ACCESS_PASSWORD
        sync: false

      - key: DATA_DIR
        value: /var/data
